name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  # ============================================================================
  # 1. Dependency installation and caching
  # ============================================================================
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

  # ============================================================================
  # 2. Format check
  # ============================================================================
  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Check formatting
        run: npm run format:check

  # ============================================================================
  # 3. Lint
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # 4. Type checking
  # ============================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client (required for type checking)
        run: npm run db:generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          DATABASE_DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      - name: Run TypeScript compiler
        run: npm run typecheck

  # ============================================================================
  # 5. Unit tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          DATABASE_DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          DATABASE_DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          JWT_ACCESS_SECRET: 'ci-test-access-secret-min-64-chars-for-testing-only-not-prod'
          JWT_REFRESH_SECRET: 'ci-test-refresh-secret-min-64-chars-for-testing-only-not-prod'
          RABBITMQ_URL: 'amqp://guest:guest@localhost:5672'
          METRICS_TOKEN: 'ci-metrics-token'

  # ============================================================================
  # 6. Integration tests (with real services)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: install

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: atlascloud_test
          POSTGRES_USER: atlascloud_admin
          POSTGRES_PASSWORD: ci_admin_password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3.13-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Create restricted app user in PostgreSQL
        run: |
          PGPASSWORD=ci_admin_password psql -h localhost -U atlascloud_admin -d atlascloud_test -c \
            "CREATE ROLE atlascloud_app WITH LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://atlascloud_admin:ci_admin_password@localhost:5432/atlascloud_test
          DATABASE_DIRECT_URL: postgresql://atlascloud_admin:ci_admin_password@localhost:5432/atlascloud_test

      - name: Apply post-migration grants
        run: |
          PGPASSWORD=ci_admin_password psql -h localhost -U atlascloud_admin -d atlascloud_test \
            -f scripts/post-migrate-grants.sql

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://atlascloud_app:ci_app_password@localhost:5432/atlascloud_test
          DATABASE_DIRECT_URL: postgresql://atlascloud_admin:ci_admin_password@localhost:5432/atlascloud_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_ACCESS_SECRET: 'ci-test-access-secret-min-64-chars-for-testing-only-not-prod'
          JWT_REFRESH_SECRET: 'ci-test-refresh-secret-min-64-chars-for-testing-only-not-prod'
          METRICS_TOKEN: 'ci-metrics-token'

  # ============================================================================
  # 7. Build
  # ============================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          DATABASE_DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      - name: Build all workspaces
        run: npm run build

  # ============================================================================
  # 8. Security audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true # Don't block on moderate vulnerabilities during development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
